<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#252630" />
    <meta name="description" content="「陆取通知」新生舞会现场点歌队列。扫码点歌，实时查看排队进度。" />
    <title>陆取通知｜新生舞会点歌台</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="./config.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="返回点歌队列">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span class="brand-name">陆取通知 <small>新生舞会点歌台</small></span>
        </a>
        <div class="top-actions">
          <button id="requestShortcut" class="button button-primary compact" type="button">点歌</button>
          <button id="visualButton" class="icon-button visual-button" type="button" title="全屏主视觉" aria-label="全屏主视觉" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M8 21H3v-5m13 5h5v-5"/></svg>
          </button>
          <button id="visualQrButton" class="icon-button visual-button" type="button" title="全屏扫码" aria-label="全屏主视觉与点歌二维码" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zm4 0h2v2h-2zm-4 4h2v2h-2zm4 0h2v2h-2z"/></svg>
          </button>
          <button id="adminButton" class="icon-button" type="button" title="管理员入口" aria-label="管理员入口">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v-2m-5 7h10a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2Zm9-11V7a4 4 0 0 0-8 0v4"/></svg>
          </button>
        </div>
      </header>

      <main>
        <section id="queueView" class="view queue-view">
          <div class="stage-panel">
            <div class="stage-image" role="img" aria-label="陆取通知新生舞会背景"></div>
            <div class="stage-content">
              <div class="now-playing">
                <p class="eyebrow">正在演唱</p>
                <h1 id="nowSong">等你开唱</h1>
                <p id="nowSinger" class="now-singer">点一首，舞台等你</p>
              </div>
              <div class="hero-qr">
                <div id="qrCode" class="qr-code" aria-label="点歌页面二维码"></div>
                <strong id="requestAccessLabel">扫码点歌</strong>
              </div>
            </div>
          </div>

          <div class="queue-layout">
            <section class="queue-section" aria-labelledby="queueTitle">
              <div class="section-heading">
                <h2 id="queueTitle">当前队列</h2>
                <span id="queueCount" class="queue-count">0 首待唱</span>
              </div>
              <div class="loop-viewport">
                <ol id="queueList" class="queue-list loop-track" aria-live="polite"></ol>
                <div id="emptyState" class="empty-state"><p>还没有人点歌</p></div>
              </div>
            </section>

            <section id="historySection" class="history-section" aria-labelledby="historyTitle">
              <div class="section-heading">
                <h2 id="historyTitle">已经唱过</h2>
              </div>
              <div class="loop-viewport">
                <div id="historyList" class="history-list loop-track"></div>
                <div id="historyEmpty" class="empty-state"><p>还没有演唱记录</p></div>
              </div>
            </section>
          </div>
        </section>

        <section id="requestView" class="view request-view" hidden>
          <div class="request-hero">
            <button id="backToQueue" class="back-button" type="button" aria-label="返回队列">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <h1>点一首，下一位就是你</h1>
            <p>抵达此刻，唱出第一次心动。请留一个大家认得出的名字。</p>
          </div>
          <form id="songForm" class="song-form">
            <label for="singerName">你的名字</label>
            <input id="singerName" name="singer" type="text" maxlength="30" autocomplete="name" placeholder="例如：小明" required />
            <label for="songName">想唱的歌</label>
            <input id="songName" name="song" type="text" maxlength="80" autocomplete="off" placeholder="歌曲名" required />
            <button id="submitSong" class="button button-primary submit-button" type="submit">提交点歌</button>
            <p class="form-note">管理员审核通过后会显示在大屏队列。</p>
          </form>
          <div id="closedPanel" class="closed-panel" hidden>
            <h2>点歌暂未开放</h2>
            <p>请留意现场通知。</p>
            <button class="text-button go-queue" type="button">查看当前队列</button>
          </div>
          <div id="successPanel" class="success-panel" hidden>
            <div class="success-check" aria-hidden="true">✓</div>
            <h2>已提交审核</h2>
            <p id="successMessage"></p>
          </div>
        </section>
      </main>
    </div>

    <button id="visualOverlay" class="visual-overlay" type="button" aria-label="退出全屏主视觉" hidden>
      <img src="./主视觉.jpg" alt="陆取通知新生舞会主视觉" />
    </button>
    <button id="visualQrOverlay" class="visual-overlay visual-qr-overlay" type="button" aria-label="退出全屏扫码画面" hidden>
      <span class="visual-qr-panel">
        <span id="visualQrCode" class="visual-qr-code" aria-label="点歌页面二维码"></span>
        <strong id="visualQrLabel">扫码点歌</strong>
      </span>
    </button>

    <dialog id="adminDialog" class="admin-dialog">
      <button class="dialog-close" type="button" aria-label="关闭">×</button>
      <div id="loginPanel">
        <h2>管理员入口</h2>
        <p class="dialog-copy">输入活动统一密码，即可调整当前演唱、完成或删除歌曲。</p>
        <form id="loginForm">
          <label for="adminPassword">统一管理员密码</label>
          <input id="adminPassword" name="password" type="password" autocomplete="current-password" placeholder="请输入活动管理员密码" required />
          <button class="button button-dark" type="submit">进入管理</button>
        </form>
        <p id="demoAdminHint" class="demo-hint" hidden>演示模式密码：<code>admin</code></p>
      </div>
      <div id="adminPanel" hidden>
        <div class="admin-header">
          <h2>队列管理</h2>
          <button id="logoutButton" class="text-button" type="button">退出</button>
        </div>
        <div class="setting-row">
          <div>
            <strong>点歌通道</strong>
            <small id="requestsState">开放中</small>
          </div>
          <label class="switch" for="requestsToggle">
            <input id="requestsToggle" type="checkbox" checked />
            <span class="switch-track" aria-hidden="true"></span>
            <span class="sr-only">开放点歌通道</span>
          </label>
        </div>
        <div id="adminQueue" class="admin-queue"></div>
        <button id="clearAll" class="button button-danger-outline" type="button">彻底清空全部记录</button>
      </div>
      <p id="dialogError" class="error-message" role="alert"></p>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
